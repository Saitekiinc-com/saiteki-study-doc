name: Auto Close Search Request

on:
  pull_request:
    types: [closed]

jobs:
  close-search-request:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close Parent Search Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // 1. Identify the User (PR Author)
            const author = pr.user.login;
            console.log(`PR merged by @${author}. Checking for open Search Requests...`);

            // 2. Find OPEN Book Search Request by this author
            // We assume the "One Request Rule" is enforced, so there should be at most one.
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: author,
              labels: 'book-search-request'
            });

            if (issues.data.length > 0) {
              const searchIssue = issues.data[0];
              console.log(`Found open Search Request: #${searchIssue.number}`);

              // 3. Close it!
              const comment = `🎉 読書感想文 (PR #${pr.number}) がマージされたため、この探索依頼は自動的に完了とします。\n\nお疲れ様でした！このIssueは自動的にクローズされます。`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: searchIssue.number,
                body: comment
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: searchIssue.number,
                state: 'closed'
              });

              console.log(`Successfully closed Search Request #${searchIssue.number}.`);
            } else {
              console.log(`No open Search Request found for @${author}. Nothing to close.`);
            }
