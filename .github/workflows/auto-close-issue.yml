name: Auto Close Search Request

on:
  pull_request:
    types: [closed]

jobs:
  close-search-request:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close Parent Search Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // 1. Find linked issue (The Book Report Issue) from PR body
            // Looks for "Closes #123" or similar keywords
            const closingRefRegex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+(?:#|https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/)(\d+)/i;
            const match = pr.body ? pr.body.match(closingRefRegex) : null;

            if (!match) {
              console.log("No linked issue found in PR body. Skipping.");
              return;
            }

            const reportIssueNumber = match[1];
            console.log(`Found linked Book Report Issue: #${reportIssueNumber}`);

            // 2. Fetch the Book Report Issue to find the Parent Search Request URL
            const reportIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: reportIssueNumber
            });

            const body = reportIssue.data.body || "";

            // Extract URL from "関連する書籍探索依頼のURL" field
            // The template uses specific header or label. We look for the URL pattern after the localized label.
            // Assumption: The user puts the URL in the input field which renders in body.
            // Regex to find github issue url after the label
            const urlRegex = /関連する書籍探索依頼のURL.*?(https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+))/s;
            const urlMatch = body.match(urlRegex);

            if (urlMatch) {
              const searchRequestUrl = urlMatch[1];
              const searchIssueNumber = urlMatch[2];

              console.log(`Found Parent Search Request Issue: #${searchIssueNumber}`);

              // 3. Close the Search Request Issue
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: searchIssueNumber,
                body: `🎉 読書感想文 ( #${reportIssueNumber} ) がマージされたため、この探索依頼は自動的に完了とします。\n\nお疲れ様でした！次のサイクルも楽しんでください。`
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: searchIssueNumber,
                state: 'closed'
              });

              console.log(`Successfully closed Search Request #${searchIssueNumber}.`);
            } else {
              console.log("No parent Search Request URL found in the Book Report Issue body.");
            }
