name: Auto Label by Checkbox

on:
  issues:
    types: [opened, edited]

jobs:
  label-manager:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: contains(github.event.issue.labels.*.name, 'book-search-request')
    steps:
      - name: Manage Labels
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const labels = [];

            // Add Status Checkboxes if missing (Post-creation operation)
            const statusSectionHeader = '## ステータス管理 (Status)';
            if (!body.includes(statusSectionHeader)) {
              const newBody = body + `\n\n${statusSectionHeader}\n以下のチェックボックスは、進捗に応じてチェックを入れてください。\n- [ ] 領収書を添付した (Receipt Attached)\n- [ ] 承認済み (Approved)`;
              await github.rest.issues.update({
                owner, repo, issue_number,
                body: newBody
              });
              console.log('Appended status checkboxes to issue body.');
              // We can return here effectively, as the checkboxes are definitely unchecked right now.
              // However, allowing it to proceed is fine too.
            }

            // Check for Receipt
            if (body.includes('- [x] 領収書を添付した')) {
              labels.push('領収書あり');
            }

            // Check for Approval
            if (body.includes('- [x] 承認済み')) {
              labels.push('承認済み');
            }

            const issue_number = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Function to ensure label exists
            async function ensureLabel(name, color) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color });
                  console.log(`Created label: ${name}`);
                }
              }
            }

            // Ensure labels exist
            if (labels.includes('領収書あり')) await ensureLabel('領収書あり', '1D76DB'); // Blue
            if (labels.includes('承認済み')) await ensureLabel('承認済み', '0E8A16'); // Green

            // Get current labels
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number
            });
            const currentLabelNames = currentLabels.map(l => l.name);

            // Add missing labels
            for (const label of labels) {
              if (!currentLabelNames.includes(label)) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number, labels: [label]
                });
                console.log(`Added label: ${label}`);
              }
            }

            // Remove labels if unchecked (optional, but good for state sync)
            if (!labels.includes('領収書あり') && currentLabelNames.includes('領収書あり')) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '領収書あり' });
                console.log('Removed label: 領収書あり');
              } catch (e) { console.error(e); }
            }

            if (!labels.includes('承認済み') && currentLabelNames.includes('承認済み')) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: '承認済み' });
                console.log('Removed label: 承認済み');
              } catch (e) { console.error(e); }
            }
