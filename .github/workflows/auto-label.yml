name: Auto Label by Checkbox

on:
  issues:
    types: [edited, labeled, reopened, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label-manager:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: contains(github.event.issue.labels.*.name, 'book-search-request')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Manage Labels
        uses: actions/github-script@v7
        with:
          script: |
            const { syncLabels } = require('./scripts/ラベルとチェックボックスの同期/sync-labels.js');
            await syncLabels({ github, context, core });
