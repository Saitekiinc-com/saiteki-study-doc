name: Ingest Book Report

on:
  issues:
    types: [opened, labeled]

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'book-report')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'book-report')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Author Display Name
        id: author
        uses: actions/github-script@v7
        with:
          script: |
            const { data: user } = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            core.setOutput('name', user.name || context.payload.issue.user.login);

      - name: Create Book Report Markdown
        id: generator
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ steps.author.outputs.name }}
        run: node scripts/読書感想文の取り込み/ingest-book-report.js

      - name: Extract Parent Issue
        id: parent_issue
        uses: actions/github-script@v7
        with:
          script: |
            const { findParentIssue } = require('./scripts/親Issueの特定/find-parent-issue.js');
            const nodeId = context.payload.issue.node_id;

            try {
              const parentNum = await findParentIssue(github.graphql, nodeId);

              if (parentNum) {
                console.log(`Found parent issue via Tasklist: #${parentNum}`);
                core.setOutput('number', parentNum);
              } else {
                console.log('No parent tracked issue found.');
              }
            } catch (error) {
              console.error('Failed to fetch parent issue:', error);
            }

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "feat: add book report from issue #${{ github.event.issue.number }}"
          title: "feat: add book report '${{ steps.generator.outputs.book_title }}'"
          body: |
            Issue #${{ github.event.issue.number }} から新しい読書感想文を追加しました。

            Closes #${{ github.event.issue.number }}
            ${{ steps.parent_issue.outputs.number && format('Closes #{0}', steps.parent_issue.outputs.number) || '' }}

            元Issue: ${{ github.event.issue.html_url }}

            - [ ] 内容を確認しました
            - [ ] マージします
          branch: "book-report/issue-${{ github.event.issue.number }}"
          base: main
          labels: "documentation, book-report"

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "PRを作成しました。このIssueは自動的にクローズされます。"
