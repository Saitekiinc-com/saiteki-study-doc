name: Ingest Book Report

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'book-report')
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Book Report Markdown
        id: generator
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/ingest-book-report.js

      - name: Rename Issue
        uses: actions/github-script@v7
        with:
          script: |
            const bookTitle = '${{ steps.generator.outputs.book_title }}'.replace(/'/g, "\\'");
            const newTitle = `📚 [${bookTitle}] 読書感想文`;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: newTitle
            });

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "feat: add book report from issue #${{ github.event.issue.number }}"
          title: "feat: add book report '${{ steps.generator.outputs.book_title }}'"
            Issue #${{ github.event.issue.number }} から読書感想文を生成しました。

            元記事: ${{ github.event.issue.html_url }}

            ## 次のアクション

            - [ ] **内容の確認** (担当: レビュアー)
                - 読み物として学びがあるか
                - 検索でヒットした際の解決策が具体的か
                - 読む前の目的が明確に書かれているか
                - 問題なければ「Files changed」タブから **Approve (承認)** をしてください。

            - [ ] **マージ** (担当: 投稿者本人)
                - レビュアーから **1件以上のApprove** が付いていることを確認してください。
                - 確認できたら「Merge pull request」ボタンを押して完了させてください。

            - [ ] **自動共有**
                - マージされると自動的にSlackへ通知されます。
          branch: "book-report/issue-${{ github.event.issue.number }}"
          base: main
          labels: "documentation"
