name: Ingest Book Report

on:
  issues:
    types: [opened, labeled]

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'book-report')
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Author Display Name
        id: author
        uses: actions/github-script@v7
        with:
          script: |
            const { data: user } = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            core.setOutput('name', user.name || context.payload.issue.user.login);

      - name: Create Book Report Markdown
        id: generator
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ steps.author.outputs.name }}
        run: node scripts/ingest-book-report.js

      - name: Extract Parent Issue
        id: parent_issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            // Match "### 関連する書籍探索課題 (Book Search Issue)" followed by content
            const regex = /### 関連する書籍探索課題 \(Book Search Issue\)[^\\n]*\\n+([\\s\\S]*?)(?=(?:###|$))/;
            const match = body.match(regex);
            if (!match) return;

            const content = match[1].trim();
            // Try to find an issue number (either #123 or /issues/123)
            const numberMatch = content.match(/(?:#|\/issues\/)(\d+)/);

            if (numberMatch) {
              const parentNum = numberMatch[1];
              console.log(`Found parent issue: #${parentNum}`);
              core.setOutput('number', parentNum);
            } else {
              console.log('No parent issue number found in content:', content);
            }

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "feat: add book report from issue #${{ github.event.issue.number }}"
          title: "feat: add book report '${{ steps.generator.outputs.book_title }}'"
          body: |
            Issue #${{ github.event.issue.number }} から新しい読書感想文を追加しました。

            Closes #${{ github.event.issue.number }}
            ${{ steps.parent_issue.outputs.number && format('Closes #{0}', steps.parent_issue.outputs.number) || '' }}

            元Issue: ${{ github.event.issue.html_url }}

            - [ ] 内容を確認しました
            - [ ] マージします
          branch: "book-report/issue-${{ github.event.issue.number }}"
          base: main
          labels: "documentation, book-report"
