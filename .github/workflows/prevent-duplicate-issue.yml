name: Prevent Duplicate Book Search Request

on:
  issues:
    types: [opened]

jobs:
  check-duplicate:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'book-search-request')
    permissions:
      issues: write
    steps:
      - name: Check for existing open issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const author = context.payload.issue.user.login;
            const issue_number = context.payload.issue.number;

            // Search for open issues by the same author with the same label
            // Search for open issues by the same author with the same label
            // Using listForRepo for better consistency than search API
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: author,
              labels: 'book-search-request'
            });

            // Filter out the current issue itself
            const existingIssues = issues.data.filter(i => i.number !== issue_number);

            if (existingIssues.length > 0) {
              const existingIssue = existingIssues[0];
              const comment = `👋 @${author} さん\n\n現在、進行中の書籍探索依頼 (#${existingIssue.number}) が既に存在するため、このIssueは自動的にクローズされます。\n\n**Saiteki書籍購入補助ルール**: 依頼は1人につき1件までです。前のサイクル（感想文の提出・マージまで）が完了してから、再度ご依頼ください。`;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue_number,
                body: comment
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue_number,
                state: 'closed'
              });

              console.log(`Duplicate issue found (#${existingIssue.number}). Closing #${issue_number}.`);
            } else {
              console.log("No duplicate active issues found. Proceeding.");
            }
