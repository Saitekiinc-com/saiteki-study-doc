name: Book Search Request

on:
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'book-search-request'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @google/generative-ai glob dotenv

      - name: Update Vectors (Just-in-Time)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-vectors.js

      - name: Parse Issue Body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            // Helper to extract value from Issue Form body
            // Issue Forms format: ### Label\n\nValue\n\n
            function extractValue(label) {
              // Match ### Label (anything until newline) \n\n (Value) \n\n (next ### or end)
              const regex = new RegExp(`###\\s*${label}[^\\n]*\\n+([\\s\\S]*?)(?:###|$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const role = extractValue('役割');
            const experience = extractValue('経験年数');
            const current_understanding = extractValue('わかっていること');
            const current_unknowns = extractValue('わかっていないこと');
            const objective = extractValue('達成したい目標');

            core.setOutput('role', role);
            core.setOutput('experience', experience);
            core.setOutput('current_understanding', current_understanding);
            core.setOutput('current_unknowns', current_unknowns);
            core.setOutput('objective', objective);

      - name: Debug Parsed Values
        run: |
          echo "Role: ${{ steps.parse.outputs.role }}"
          echo "Experience: ${{ steps.parse.outputs.experience }}"
          echo "Understanding: ${{ steps.parse.outputs.current_understanding }}"
          echo "Unknowns: ${{ steps.parse.outputs.current_unknowns }}"
          echo "Objective: ${{ steps.parse.outputs.objective }}"

      - name: Generate Book Recommendations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_REQUEST: |
            【役割】: ${{ steps.parse.outputs.role }}
            【経験年数】: ${{ steps.parse.outputs.experience }}
            【わかっていること】: ${{ steps.parse.outputs.current_understanding }}
            【わかっていないこと】: ${{ steps.parse.outputs.current_unknowns }}
            【達成したい目標】: ${{ steps.parse.outputs.objective }}
        run: |
          # Run script (writes to roadmap_body.md)
          node scripts/recommend-books.js

      - name: Get Author Display Name
        id: author
        uses: actions/github-script@v7
        with:
          script: |
            const { data: user } = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            core.setOutput('name', user.name || context.payload.issue.user.login);

      - name: Rename Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_NAME: ${{ steps.author.outputs.name }}
          OBJECTIVE: ${{ steps.parse.outputs.objective }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --title "📚 書籍探索: ${OBJECTIVE} (${USER_NAME}さん)"

      - name: Post Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file roadmap_body.md
