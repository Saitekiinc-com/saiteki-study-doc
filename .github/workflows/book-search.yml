name: Book Search Request

on:
  issues:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'book-search-request'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @actions/core @actions/github tsx glob dotenv @google/generative-ai

      - name: Check for Concurrent Requests
        id: check_concurrency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/重複リクエストのチェック/check-concurrent-requests.ts



      - name: Update Vectors (Just-in-Time)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/ベクトルデータの更新/update-vectors.ts

      - name: Parse Issue Body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: npx tsx scripts/書籍探索パース/parse-book-search.ts

      - name: Debug Parsed Values
        run: |
          echo "Role: ${{ steps.parse.outputs.role }}"
          echo "Experience: ${{ steps.parse.outputs.experience }}"
          echo "Understanding: ${{ steps.parse.outputs.current_understanding }}"
          echo "Unknowns: ${{ steps.parse.outputs.current_unknowns }}"
          echo "Objective: ${{ steps.parse.outputs.objective }}"

      - name: Generate Book Recommendations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_REQUEST: ${{ steps.parse.outputs.user_request }}
        run: |
          # Run script (writes to roadmap_body.md)
          npx tsx scripts/書籍の推薦/recommend-books.ts

      - name: Get Author Display Name
        id: author
        uses: actions/github-script@v7
        with:
          script: |
            const { data: user } = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            core.setOutput('name', user.name || context.payload.issue.user.login);

      - name: Rename Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ steps.author.outputs.name }}
          OBJECTIVE: ${{ steps.parse.outputs.objective }}
        run: npx tsx scripts/Issue名の変更/rename-issue.ts

      - name: Post Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file roadmap_body.md

