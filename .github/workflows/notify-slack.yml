name: Slack Notification

on:
  pull_request:
    types: [closed, labeled]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Context
        run: |
          echo "Merged: ${{ github.event.pull_request.merged }}"
          echo "Labels: ${{ toJson(github.event.pull_request.labels) }}"
          echo "Action: ${{ github.event.action }}"
      - name: Parse Book Report Content
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body;
            // Extract issue number from "Closes #123" or branch name
            let issueNumber = null;
            const match = prBody.match(/Closes #(\d+)/);
            if (match) {
              issueNumber = match[1];
            } else {
              // Fallback to branch parsing "book-report/issue-123"
              const branchMatch = context.payload.pull_request.head.ref.match(/issue-(\d+)/);
              if (branchMatch) issueNumber = branchMatch[1];
            }

            if (!issueNumber) {
              console.log('No linked issue found.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const body = issue.body;

            function extract(label) {
              const regex = new RegExp("### " + label + "[^\\n]*\\n+([\\s\\S]*?)(?=(?:###|$))");
              const m = body.match(regex);
              return m ? m[1].trim() : 'なし';
            }

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const reportFile = files.find(f => f.filename.startsWith('docs/knowledge_base/book_reports/') && f.filename.endsWith('.md'));
            let pageUrl = '';
            if (reportFile) {
              // file: docs/knowledge_base/book_reports/2025-12-17-title-123.md
              // url: https://Saitekiinc-com.github.io/saiteki-study-doc/knowledge_base/book_reports/2025-12-17-title-123.html
              const relativePath = reportFile.filename.replace(/^docs\//, '').replace(/\.md$/, '.html');
              pageUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/${relativePath}`;
            }

            const objective = extract('読む前の目的 \\(Objective\\)');
            const takeaways = extract('得られた知識・気づき \\(Key Takeaways\\)');
            const application = extract('実務における活用 \\(Application\\)');
            const positive = extract('良かった点・学び \\(Positive\\)');
            const negative = extract('難しかった点・合わなかった点 \\(Negative\\)');
            const recommend = extract('どんな人におすすめ？');

            core.setOutput('objective', objective);
            core.setOutput('takeaways', takeaways);
            core.setOutput('application', application);
            core.setOutput('positive', positive);
            core.setOutput('negative', negative);
            core.setOutput('recommend', recommend);
            core.setOutput('page_url', pageUrl);

      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'random'
          SLACK_USERNAME: 'BookRepo Bot'
          SLACK_ICON_EMOJI: ':books:'
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '📚 新しい読書感想文が追加されました！'
          SLACK_MESSAGE: "タイトル: ${{ github.event.pull_request.title }}\n投稿者: ${{ github.event.pull_request.user.login }}\nリンク: ${{ github.event.pull_request.html_url }}\n\n📖 読みやすいページで見る:\n${{ steps.parse.outputs.page_url }}\n\n--------------------------------------------------\n【読む前の目的】\n${{ steps.parse.outputs.objective }}\n\n【得られた知識・気づき】\n${{ steps.parse.outputs.takeaways }}\n\n【実務における活用】\n${{ steps.parse.outputs.application }}\n\n【良かった点・学び】\n${{ steps.parse.outputs.positive }}\n\n【難しかった点・合わなかった点】\n${{ steps.parse.outputs.negative }}\n\n【どんな人におすすめ？】\n${{ steps.parse.outputs.recommend }}\n--------------------------------------------------\nチームのナレッジとして活用しましょう！"
          SLACK_FOOTER: 'Saiteki Study Docs'
