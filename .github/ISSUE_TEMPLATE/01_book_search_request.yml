name: AIで本を選んで書籍購入補助を申請する
description: AIエージェントに自分に合った書籍を提案してもらい、書籍購入補助の手続きを進めます。
title: "📚 書籍購入補助を申請する"
labels: ["book-search-request"]
body:
  - type: markdown
    attributes:
      value: |
        あなたのバックグラウンドと目標に合わせて、最適な書籍を提案します。
        以下の項目を入力して書籍購入補助用のIssueを作成してください。数分以内にコメントで回答が届きます。

  - type: input
    id: role
    attributes:
      label: 役割
      description: 現在の職種や役割を入力してください。
      placeholder: Frontend Engineer, SRE, Engineering Manager etc.
    validations:
      required: true

  - type: input
    id: experience
    attributes:
      label: 経験年数
      description: エンジニアとしての経験年数を入力してください。
      placeholder: 3年
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: 達成したい目標
      description: |
        具体的に作りたいものや、成し遂げたいことを書いてください。
        例: 個人開発でメモアプリを作りたい、チームのCI/CDパイプラインを整備したい、など。
      placeholder: |
        自作のタスク管理アプリをAWS上にデプロイして公開したい。
        そのために必要なインフラ知識と、バックエンドの実装力をつけたい。
    validations:
      required: true

  - type: textarea
    id: current_understanding
    attributes:
      label: わかっていること
      description: |
        現在理解している技術、概念、できることを書いてください。
        例: Reactのコンポーネント作成、SQLの基本的なSELECT文、AWS EC2の起動など。
      placeholder: |
        - React: コンポーネントの作成、Props/Stateの管理はできる。
        - Backend: REST APIの概念は理解している。
    validations:
      required: true

  - type: textarea
    id: current_unknowns
    attributes:
      label: わかっていないこと
      description: |
        現在抱えている課題、理解できていない部分、苦手なことを書いてください。
        例: 非同期処理の仕組み、複雑なJOIN、インフラのネットワーク設計など。
      placeholder: |
        - React: useEffectの依存配列の挙動が怪しい。パフォーマンスチューニングがわからない。
        - Backend: DBのインデックス設計やN+1問題の解決方法がわからない。
    validations:
      required: true
